name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build catalog and compile test APKs
        run: |
          chmod +x gradlew
          ./gradlew :demo:assembleDebug :test:assembleDebug :test:assembleDebugAndroidTest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Run Android lint
        run: |
          chmod +x gradlew
          ./gradlew lintDebug
