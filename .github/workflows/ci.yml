name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
      - name: Build catalog and compile test APKs
        run: |
          chmod +x gradlew
          ./gradlew --dependency-verification strict \
            :demo:assembleDebug \
            :test:assembleDebug \
            :test:assembleDebugAndroidTest \
            :test:compileDebugScreenshotTestKotlin \
            :test:testDebugUnitTest \
            :test:performance:assembleBenchmarkRelease
      - name: Verify localization packaging contracts
        shell: pwsh
        run: ./test/gradle/verify-localization.ps1
      - name: Verify sealed theme API contracts
        shell: pwsh
        run: ./test/gradle/verify-theme-api.ps1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
      - name: Run Android lint
        run: |
          chmod +x gradlew
          ./gradlew --dependency-verification strict lintDebug
